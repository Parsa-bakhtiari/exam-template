---
- name: --- Create apt keyring dir ---
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: --- Download Grafana apt key ---
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: "0644"

- name: --- Add Grafana repository ---
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    filename: grafana
    state: present
    update_cache: true

- name: --- Install grafana ---
  ansible.builtin.apt:
    name: grafana
    state: present

- name: --- Create provisioning dirs ---
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - "{{ grafana_dashboards_dir }}"

- name: --- Provision Prometheus datasource ---
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: --- Provision dashboard provider ---
  ansible.builtin.template:
    src: dashboard-provider.yml.j2
    dest: /etc/grafana/provisioning/dashboards/default.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: --- Copy CPU/Memory dashboard ---
  ansible.builtin.copy:
    src: node-cpu-memory.json
    dest: "{{ grafana_dashboards_dir }}/node-cpu-memory.json"
    owner: grafana
    group: grafana
    mode: "0644"
  notify: Restart grafana

- name: --- Create systemd drop-in dir ---
  ansible.builtin.file:
    path: /etc/systemd/system/grafana-server.service.d
    state: directory
    mode: "0755"

- name: --- Set port and admin credentials ---
  ansible.builtin.template:
    src: override.conf.j2
    dest: /etc/systemd/system/grafana-server.service.d/override.conf
    mode: "0644"
  notify: Restart grafana

- name: --- Enable and start grafana ---
  ansible.builtin.systemd:
    name: grafana-server
    state: started
    enabled: true
    daemon_reload: true
