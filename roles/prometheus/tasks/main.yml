---
- name: --- Create prometheus user ---
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: --- Create directories ---
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: "0755"
  loop:
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_data_dir }}"

- name: --- Download prometheus ---
  ansible.builtin.get_url:
    url: "{{ prometheus_url }}"
    dest: "/tmp/{{ prometheus_pkg }}.tar.gz"
    mode: "0644"

- name: --- Unpack prometheus ---
  ansible.builtin.unarchive:
    src: "/tmp/{{ prometheus_pkg }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/{{ prometheus_pkg }}/prometheus"

- name: --- Install binaries ---
  ansible.builtin.copy:
    src: "/tmp/{{ prometheus_pkg }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    mode: "0755"
  loop:
    - prometheus
    - promtool
  notify: Restart prometheus

- name: --- Render prometheus.yml ---
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: "0644"
    validate: /usr/local/bin/promtool check config %s
  notify: Restart prometheus

- name: --- Systemd unit ---
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
  notify: Restart prometheus

- name: --- Enable and start ---
  ansible.builtin.systemd:
    name: prometheus
    state: started
    enabled: true
    daemon_reload: true
